name: S-Chat APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web dosyalarini hazirla
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Paketleri kur
        run: |
          npm install
          npm install @capacitor/app@6 @capacitor/local-notifications@6

      - name: Push bildirimi eklentisi (google-services.json varsa)
        run: |
          if [ -f google-services.json ]; then
            npm install @capacitor/push-notifications@6
            echo "PUSH_ENABLED=1" >> $GITHUB_ENV
          fi

      - name: Android projesini olustur
        run: npx cap add android

      - name: Izinleri ekle (mikrofon, kamera, bildirim)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Simgeleri yerlestir
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          unzip -o icons.zip -d android/app/src/main/res/
          mkdir -p android/app/src/main/res/drawable
          echo "" | base64 -d > android/app/src/main/res/drawable/ic_stat_schat.png
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi

      - name: Senkronla
        run: npx cap sync android

      - name: Sabit imza anahtarini yerlestir
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: S-Chat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
