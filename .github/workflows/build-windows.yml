name: S-Chat Windows exe derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dosyalari hazirla
        shell: bash
        run: |
          mkdir electron-app
          cp index.html electron-app/index.html
          cp win-main.js electron-app/main.js
          cp win-package.json electron-app/package.json
          cp icon.ico electron-app/icon.ico

      - name: Paketleri kur
        shell: bash
        working-directory: electron-app
        run: |
          npm install
          npm pkg set version=1.0.${{ github.run_number }}

      - name: exe derle
        shell: bash
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: S-Chat-Windows
          path: electron-app/dist/*.exe
