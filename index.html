<style>
:root{--bg:#fff;--bg2:#fafafa;--tx:#262626;--tx2:#737373;--bd:#dbdbdb;--bl:#0095f6;--rd:#ed4956;--hov:#efefef;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--bg2:#121212;--tx:#f5f5f5;--tx2:#a8a8a8;--bd:#262626;--hov:#1c1c1c}}
:root[data-theme="dark"]{--bg:#000;--bg2:#121212;--tx:#f5f5f5;--tx2:#a8a8a8;--bd:#262626;--hov:#1c1c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.reelmode,body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:24px;height:24px;display:block}
img{display:block}
input,textarea{font:inherit;color:var(--tx)}

/* ===== açılış (S-Entertainment) ===== */
.s{position:fixed;inset:0;display:none;z-index:70}.s.on{display:flex}
#sp{background:#fff;align-items:center;justify-content:center;transition:opacity .9s;color:#000;font-family:Rajdhani,'Segoe UI',sans-serif;font-weight:500}#sp.f{opacity:0}
.lg{display:flex;align-items:center}.lg img{width:26vw;max-width:150px;height:auto;border-radius:50%}
.tw{max-width:0;overflow:hidden;white-space:nowrap}.tw span{display:block;font:700 7vw Rajdhani;color:#000;padding-left:2px;transform:translateX(-100%);opacity:0}
#sp.a .tw{max-width:62vw;transition:max-width 1.4s ease 1.2s}#sp.a .tw span{transform:none;opacity:1;transition:all 1.4s ease 1.2s}
@media(min-width:700px){.tw span{font-size:44px}#sp.a .tw{max-width:380px}}

/* ===== giriş / kayıt ===== */
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow-y:auto;padding:24px 16px}
.auth.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.abox{width:100%;max-width:350px;padding:30px 36px 26px;border:1px solid var(--bd);border-radius:2px;background:var(--bg)}
.alogoimg{display:block;width:128px;height:128px;margin:0 auto 12px}
.alogo{font:400 46px/1.2 "Grand Hotel",cursive;text-align:center;margin-bottom:14px}
.asub{text-align:center;color:var(--tx2);font-weight:600;font-size:16px;line-height:1.3;margin:-4px 0 16px}
.abox input{display:block;width:100%;height:38px;margin-bottom:7px;padding:0 10px;border:1px solid var(--bd);border-radius:3px;background:var(--bg2);font-size:14px;outline:none}
.abox input:focus{border-color:var(--tx2)}
.abox input::placeholder{color:var(--tx2)}
.abtn{display:block;width:100%;height:34px;margin-top:10px;border-radius:8px;background:var(--bl);color:#fff;font-weight:600}
.abtn:disabled{opacity:.5}
.aer{color:var(--rd);text-align:center;font-size:14px;min-height:20px;margin-top:12px}
.asw{width:100%;max-width:350px;padding:20px;border:1px solid var(--bd);border-radius:2px;text-align:center;font-size:14px}
.asw button{color:var(--bl);font-weight:600}
.terms{color:var(--tx2);font-size:12px;text-align:center;margin-top:12px}

/* ===== uygulama ===== */
#app{max-width:470px;margin:0 auto;min-height:100vh}
#app[hidden]{display:none}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.hd .logo{font:400 30px/1 "Grand Hotel",cursive;letter-spacing:.2px}
.hd .hr{display:flex;gap:18px}
.hd .hr button{position:relative}
.hd .un{font-size:17px;font-weight:700}
.dot{position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--rd);border:2px solid var(--bg)}
.badge{position:absolute;top:-6px;right:-8px;min-width:17px;height:17px;border-radius:9px;background:var(--rd);color:#fff;font:700 11px/17px sans-serif;text-align:center;font-style:normal}
#main{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}

.nbanner{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);width:min(94vw,440px);background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;box-shadow:0 6px 24px #0005;z-index:150;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:transform .32s cubic-bezier(.2,.8,.3,1)}
.nbanner.in{transform:translate(-50%,0)}
.nbanner span{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

const artC={};
function art(seed,kind,w=600,h=600){
 const key=seed+'|'+kind+'|'+w+'|'+h;if(artC[key])return artC[key];
 const r=rng(hstr(seed)),H0=Math.floor(r()*360),hs=(a,s,l)=>`hsl(${(Math.round(a)+360)%360} ${s}% ${l}%)`;
 const sky=(a,b)=>`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/>`;
 const ridge=(base,amp,n,col)=>{let p=`M0 ${h}L0 ${Math.round(base)}`;for(let i=1;i<=n;i++)p+=`L${Math.round(w*i/n)} ${Math.round(base-r()*amp)}`;return`<path d="${p}L${w} ${h}Z" fill="${col}"/>`};
 let b='';
 if(kind==='sunset'){b=sky(hs(H0,75,24),hs(H0+40,90,64));b+=`<circle cx="${Math.round(w*(.3+r()*.4))}" cy="${Math.round(h*.55)}" r="${Math.round(w*.14)}" fill="${hs(H0+50,100,82)}"/>`;for(let k=0;k<3;k++)b+=ridge(h*(.62+k*.11),h*.17,9,hs(H0+210,32-k*7,24-k*7))}
 else if(kind==='ocean'){b=sky(hs(195,75,72),hs(208,80,38));b+=`<circle cx="${Math.round(w*(.25+r()*.5))}" cy="${Math.round(h*.3)}" r="${Math.round(w*.09)}" fill="#fff6c8"/>`;for(let k=0;k<6;k++){const y=h*(.5+k*.09);let p=`M0 ${h}L0 ${y}`;for(let x=0;x<=w;x+=15)p+=`L${x} ${(y+Math.sin(x/w*6.28*(2+k)+k*1.7)*9).toFixed(1)}`;b+=`<path d="${p}L${w} ${h}Z" fill="${hs(205,70,50-k*6)}"/>`}}
 else if(kind==='city'){b=sky(hs(H0,55,16),hs(H0+30,65,42));let x=0;while(x<w){const bw=28+r()*46,bh=h*(.2+r()*.42);b+=`<rect x="${Math.round(x)}" y="${Math.round(h-bh)}" width="${Math.round(bw)}" height="${Math.round(bh)}" fill="${hs(H0+200,25,9+r()*8)}"/>`;for(let wy=h-bh+8;wy<h-8;wy+=14)for(let wx=x+5;wx<x+bw-8;wx+=11)if(r()>.55)b+=`<rect x="${Math.round(wx)}" y="${Math.round(wy)}" width="5" height="7" fill="#ffd978"/>`;x+=bw+2}}
 else if(kind==='forest'){b=sky(hs(150,35,78),hs(160,50,34));for(let row=0;row<4;row++){const y=h*(.52+row*.13);for(let x=-20;x<w+30;x+=36+r()*14){const th=h*(.2+r()*.1),tw=40+r()*14;b+=`<polygon points="${Math.round(x)},${Math.round(y)} ${Math.round(x+tw/2)},${Math.round(y-th)} ${Math.round(x+tw)},${Math.round(y)}" fill="${hs(145+row*6,48-row*5,30-row*5)}"/>`}b+=`<rect x="0" y="${Math.round(y)}" width="${w}" height="${h}" fill="${hs(145+row*6,48-row*5,30-row*5)}"/>`}}
 else if(kind==='night'){b=sky(hs(240,60,9),hs(262,55,30));for(let k=0;k<70;k++)b+=`<circle cx="${Math.round(r()*w)}" cy="${Math.round(r()*h*.7)}" r="${(r()*1.8+.4).toFixed(1)}" fill="#fff" opacity="${(.4+r()*.6).toFixed(2)}"/>`;const mx=w*(.55+r()*.3);b+=`<circle cx="${Math.round(mx)}" cy="${Math.round(h*.24)}" r="${Math.round(w*.08)}" fill="#fff3c4"/><circle cx="${Math.round(mx+w*.03)}" cy="${Math.round(h*.22)}" r="${Math.round(w*.075)}" fill="${hs(245,58,16)}"/>`;b+=ridge(h*.78,h*.14,8,hs(250,40,8));b+=ridge(h*.88,h*.1,7,hs(250,45,5))}
 else{b=`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hs(H0,85,58)}"/><stop offset="1" stop-color="${hs(H0+70,85,42)}"/></linearGradient><filter id="f"><feGaussianBlur stdDeviation="${Math.round(w/16)}"/></filter></defs><rect width="${w}" height="${h}" fill="url(#g)"/><g filter="url(#f)">`;for(let k=0;k<7;k++)b+=`<circle cx="${Math.round(r()*w)}" cy="${Math.round(r()*h)}" r="${Math.round(w*(.1+r()*.2))}" fill="${hs(H0+r()*180,90,55+r()*20)}" opacity=".8"/>`;b+='</g>'}
 return artC[key]='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">${b}</svg>`);
}

const cbarH=()=>`<input id="ci" placeholder="Mesaj yaz..." autocomplete="off" aria-label="Mesaj"><button id="micb" data-act="mic" aria-label="Ses kaydı">${I.mic}</button><button id="sendb" data-act="csend" style="display:none">Gönder</button>`;

let REC=null,AP=null;
function showRecBar(){const b=$('.cbar');if(b)b.innerHTML=`<div class="recbar"><i class="recdot"></i><span id="rtime">0:00</span><span style="flex:1;color:var(--tx2)">Kaydediliyor…</span><button data-act="reccancel" aria-label="İptal">${I.close}</button><button data-act="recsend" style="color:var(--bl)" aria-label="Gönder">${I.send}</button></div>`}
function hideRecBar(){const b=$('.cbar');if(b){b.innerHTML=cbarH();bindCbar()}}
async function startRec(){
 if(REC)return;if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Ses kaydı bu cihazda desteklenmiyor');
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('Mikrofon izni gerekli')}
 const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
 let mr;try{mr=new MediaRecorder(st,mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000})}catch(e){st.getTracks().forEach(t=>t.stop());return toast('Ses kaydı başlatılamadı')}
 const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 REC={mr,st,chunks,t0:Date.now(),mime:mr.mimeType,timer:setInterval(()=>{if(!REC)return;const s=Math.floor((Date.now()-REC.t0)/1000),el=$('#rtime');if(el)el.textContent=fmtDur(s);if(s>=60)stopRec(true)},250)};
 mr.start();showRecBar()}
function stopRec(send){
 if(!REC)return;const r=REC;REC=null;clearInterval(r.timer);
 r.mr.onstop=async()=>{r.st.getTracks().forEach(t=>t.stop());hideRecBar();if(!send)return;
  const dur=Math.max(1,Math.round((Date.now()-r.t0)/1000)),blob=new Blob(r.chunks,{type:r.mime||'audio/webm'});
  if(blob.size>600*1024)return toast('Ses kaydı çok uzun');
  const c=chatOf(route.id);if(!c)return;
  try{await sendText(c,'🎤 Ses mesajı',{audio:await blobToDataURL(blob),dur})}catch(e){fail(e)}};
 try{r.mr.stop()}catch(e){r.st.getTracks().forEach(t=>t.stop());hideRecBar()}}
function toggleAudio(mid){
 const m=(MSGS[route.id]||[]).find(x=>x.id===mid);if(!m||!m.audio)return;
 if(AP&&AP.id===mid){if(AP.a.paused)AP.a.play().catch(()=>{});else AP.a.pause();return}
 if(AP)AP.a.pause();
 const a=new Audio(m.audio);AP={id:mid,a};a.ontimeupdate=()=>syncAudioUI();a.onended=()=>syncAudioUI(true);a.onpause=()=>syncAudioUI();a.onplay=()=>syncAudioUI();
 a.play().catch(()=>toast('Ses oynatılamadı'))}
function syncAudioUI(ended){$$('.bub.aud').forEach(b=>{const on=AP&&b.dataset.mid===AP.id,pp=$('.pp',b),bar=$('.wv i',b);if(on){pp.textContent=(AP.a.paused||ended)?'▶':'❚❚';bar.style.width=ended?'0':Math.min(100,(AP.a.currentTime/(AP.a.duration||1))*100)+'%'}else{pp.textContent='▶';bar.style.width='0'}})}

/* ---------- video (Storage yerine Firestore parçaları) ---------- */
const CH=900000,vurl={};
async function loadVideo(id){
 if(vurl[id])return vurl[id];const p=getPost(id);if(p&&p.video)return p.video;
 if(p&&p.vready===false)throw new Error('notready');
 const s=await db.collection('posts').doc(id).collection('chunks').orderBy('i').get(),parts=s.docs.map(d=>d.data().d);
 if(!p||parts.length<(p.vchunks||1))throw new Error('incomplete');
 const blob=await (await fetch(parts.join(''))).blob();return vurl[id]=URL.createObjectURL(blob)}
async function playInline(host,pid,el){
 const sp=$('.vplay',el);if(sp)sp.textContent='Yükleniyor…';
 try{const u=await loadVideo(pid);const vph=host.querySelector('.vph');if(vph)vph.outerHTML=`<video src="${u}" playsinline controls autoplay></video>`}
 catch(e){if(sp)sp.textContent='▶';toast(e.message==='notready'?'Video hâlâ yükleniyor, birazdan dene':'Video yüklenemedi')}}
async function shrinkVideo(file,prog){
 const url=URL.createObjectURL(file),v=document.createElement('video');v.src=url;v.playsInline=true;v.preload='auto';
 await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('meta'))});
 const dur=v.duration;if(!isFinite(dur)||dur>90)throw new Error('long');
 const sc=Math.min(1,480/Math.min(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*sc/2)*2,h=Math.round(v.videoHeight*sc/2)*2;
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),stream=c.captureStream(24);
 try{const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaElementSource(v),dest=ac.createMediaStreamDestination();src.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){}
 const mime=['video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw new Error('nomr');
 const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:650000,audioBitsPerSecond:48000}),chunks=[];
 mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

 const pc=CALL.pc=newPC();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 let ready=false;const buf=[];
 pc.onicecandidate=e=>{if(!e.candidate)return;const c=e.candidate.toJSON();if(ready)ref.collection('callerCandidates').add(c).catch(()=>{});else buf.push(c)};
 try{
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await ref.set({caller:UID,callee:peer,chatId:dmId(UID,peer),video:!!video,state:'ringing',offer:{type:offer.type,sdp:offer.sdp},ts:Date.now()});
  ready=true;buf.splice(0).forEach(c=>ref.collection('callerCandidates').add(c).catch(()=>{}));
 }catch(e){fail(e);cleanupCall(false);return}
 CALL.unsubs.push(ref.onSnapshot(s=>{const d=s.data();if(!d||!CALL||CALL.id!==s.id)return;
  if(d.answer&&!pc.remoteDescription){pc.setRemoteDescription(d.answer).then(flushCand).catch(()=>{});const el=$('#cst');if(el&&!CALL.t0)el.textContent='Bağlanıyor…'}
  if(d.state==='declined'||d.state==='busy'){toast(d.state==='busy'?'Kullanıcı meşgul':'Arama reddedildi');cleanupCall(true)}
  else if(d.state==='ended'||d.state==='missed')cleanupCall(true)}));
 CALL.unsubs.push(ref.collection('calleeCandidates').onSnapshot(s=>s.docChanges().forEach(ch=>{if(ch.type==='added')addCand(ch.doc.data())})));
 CALL.to=setTimeout(()=>{if(CALL&&!CALL.t0){ref.update({state:'missed'}).catch(()=>{});toast('Cevap yok');cleanupCall(true)}},45000)}
function startCallListener(){
 unsubs.push(db.collection('calls').where('callee','==',UID).where('state','==','ringing').onSnapshot(s=>{
  s.docChanges().forEach(ch=>{const d=ch.doc.data();
   if(ch.type==='added'){if(Date.now()-d.ts>60000)return;if(CALL||INC){db.collection('calls').doc(ch.doc.id).update({state:'busy'}).catch(()=>{});return}showIncoming(ch.doc.id,d)}
   else if(ch.type==='removed'&&INC&&INC.id===ch.doc.id)hideIncoming()})},errL))}
function showIncoming(id,d){
 const u=usr(d.caller);INC={id,d};ringStart();if(document.hidden)pushLocal(u.username+' seni arıyor',d.video?'Görüntülü arama':'Sesli arama',{});
 INC.layer=layer(`<div class="callbox"><div class="cinfo"><div class="cav">${av(u,110)}</div><b>${esc(u.username)}${vb(u)}</b><span>${d.video?'Görüntülü arama':'Sesli arama'}…</span></div><div class="cctl"><button class="cend" data-act="cdec" aria-label="Reddet">${I.phone}</button><button class="cacc" data-act="cacc" aria-label="Cevapla">${I.phone}</button></div></div>`,'callL')}
function hideIncoming(){ringStop();if(INC){try{INC.layer.remove()}catch(e){}INC=null}}
function declineCall(){const inc=INC;if(!inc)return;hideIncoming();db.collection('calls').doc(inc.id).update({state:'declined'}).catch(()=>{})}
async function acceptCall(){
 const inc=INC;if(!inc)return;hideIncoming();
 const stream=await getMedia(inc.d.video);
 const ref=db.collection('calls').doc(inc.id);
 if(!stream){ref.update({state:'declined'}).catch(()=>{});return}
 CALL={id:inc.id,role:'callee',peer:inc.d.caller,video:!!inc.d.video,local:stream,pc:null,unsubs:[],pend:[],t0:0};
 CALL.layer=callBox(CALL.peer,CALL.video,'Bağlanıyor…',callBtns(CALL.video));
 const lv=$('#lv');if(lv)lv.srcObject=stream;
 const pc=CALL.pc=newPC();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>{if(e.candidate)ref.collection('calleeCandidates').add(e.candidate.toJSON()).catch(()=>{})};
 try{
  await pc.setRemoteDescription(inc.d.offer);flushCand();
  const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
  await ref.update({answer:{type:ans.type,sdp:ans.sdp},state:'accepted'});
 }catch(e){fail(e);cleanupCall(false);return}
 CALL.unsubs.push(ref.collection('callerCandidates').onSnapshot(s=>s.docChanges().forEach(ch=>{if(ch.type==='added')addCand(ch.doc.data())})));
 CALL.unsubs.push(ref.onSnapshot(s=>{const d=s.data();if(!d||!CALL||CALL.id!==s.id)return;if(d.state==='ended'||d.state==='missed')cleanupCall(false)}))}
function endCall(){if(!CALL)return;const c=CALL;db.collection('calls').doc(c.id).update({state:'ended'}).catch(()=>{});cleanupCall(true)}
function cleanupCall(log){
 const c=CALL;if(!c)return;CALL=null;ringStop();clearTimeout(c.to);clearInterval(c.tm);
 c.unsubs.forEach(f=>{try{f()}catch(e){}});try{c.local.getTracks().forEach(t=>t.stop())}catch(e){}try{c.pc&&c.pc.close()}catch(e){}try{c.layer.remove()}catch(e){}
 if(log&&c.role==='caller'&&UID){const dur=c.t0?Math.round((Date.now()-c.t0)/1000):0,t=dur?`${c.video?'📹 Görüntülü':'📞 Sesli'} arama · ${fmtDur(dur)}`:`${c.video?'📹':'📞'} Cevapsız arama`;
  sendText({id:dmId(UID,c.peer),members:[UID,c.peer],isGroup:false},t,{sys:true}).catch(()=>{})}}
function toggleMute(el){if(!CALL)return;const t=CALL.local.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;el.classList.toggle('off',!t.enabled);el.innerHTML=t.enabled?I.mic:I.micOff}
function toggleCam(el){if(!CALL)return;const t=CALL.local.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;el.classList.toggle('off',!t.enabled);el.innerHTML=t.enabled?I.vid:I.vidOff}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
 switch(act){
  case'mic':startRec();break;case'recsend':stopRec(true);break;case'reccancel':stopRec(false);break;
  case'aplay':toggleAudio(el.dataset.mid);break;
  case'vplay':{const host=el.closest('.media'),h2=el.closest('[data-id]');if(host&&h2)playInline(host,h2.dataset.id,el);break}
  case'call':startCall(el.dataset.u,el.dataset.v==='1');break;
  case'cend':endCall();break;case'cmute':toggleMute(el);break;case'ccam':toggleCam(el);break;
  case'cacc':acceptCall();break;case'cdec':declineCall();break;
 }});

/* ================= v3: geri tuşu (Android) ve bildirimler ================= */
const NATIVE=!!(window.Capacitor&&typeof Capacitor.isNativePlatform==='function'&&Capacitor.isNativePlatform());
const CPL=(window.Capacitor&&Capacitor.Plugins)||{};
const CAPP=CPL.App,LNP=CPL.LocalNotifications,PNP=CPL.PushNotifications;
function handleBack(){
 if(CALL||INC)return;
 const top=$('#ov').lastElementChild;
 if(top){if(typeof SV!=='undefined'&&SV&&SV.l===top)closeStory();else top.remove();return}
 const e=NAV[NAV.length-1];
 if(e&&e.k==='r'){NAV.pop();route=e.prev;lastSig='';render(true);return}
 if(route.t!=='home'){tab('home');return}
 try{CAPP&&CAPP.exitApp()}catch(x){}}
if(NATIVE&&CAPP&&CAPP.addListener){try{CAPP.addListener('backButton',handleBack)}catch(e){console.warn(e)}}

let PUSH_ON=false,MYTOKEN=null,PENDING_CHAT=null,notifInit=false;
const ICON_URL=(document.querySelector('link[rel=icon]')||{}).href||'';
function openChatById(id){
 const c=CHATS.find(x=>x.id===id);if(!c){PENDING_CHAT=id;return}
 PENDING_CHAT=null;closeSheets();
 if(route.t==='chat'&&route.id===id)return;
 go({t:'chat',id,peer:c.isGroup?undefined:peerOf(c)})}
function openPending(){if(PENDING_CHAT&&UID)openChatById(PENDING_CHAT)}
function banner(title,body,extra){
 const b=document.createElement('div');b.className='nbanner';b.innerHTML=`<b>${esc(title)}</b><span>${esc(body)}</span>`;
 b.onclick=()=>{b.remove();if(extra&&extra.chat)openChatById(extra.chat)};document.body.appendChild(b);
 setTimeout(()=>b.classList.add('in'),20);setTimeout(()=>{b.classList.remove('in');setTimeout(()=>b.remove(),350)},4200);
 try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
function pushLocal(title,body,extra){
 if(NATIVE&&LNP){LNP.schedule({notifications:[{id:Math.floor(Math.random()*2e9),title,body,channelId:'messages',smallIcon:'ic_stat_schat',extra:extra||{}}]}).catch(e=>console.warn(e))}
 else if(window.Notification&&Notification.permission==='granted'){try{const n=new Notification(title,{body,icon:ICON_URL,tag:extra&&extra.chat||undefined});n.onclick=()=>{try{window.focus()}catch(e){}if(extra&&extra.chat)openChatById(extra.chat);n.close()}}catch(e){}}}
function notifyEvt(title,body,extra,isMsg){
 if(!document.hidden){banner(title,body,extra);return}
 if(isMsg&&PUSH_ON)return;
 pushLocal(title,body,extra)}
async function saveToken(){if(UID&&MYTOKEN)try{await db.collection('users').doc(UID).update({fcmTokens:FV.arrayUnion(MYTOKEN)})}catch(e){}}
async function initNotifications(){
 if(notifInit)return;notifInit=true;
 try{
  if(NATIVE&&LNP){
   let p=await LNP.checkPermissions();if(p.display!=='granted')p=await LNP.requestPermissions();
   try{await LNP.createChannel({id:'messages',name:'Mesajlar',description:'Mesaj, arama ve etkinlik bildirimleri',importance:4,visibility:1,vibration:true})}catch(e){}
   LNP.addListener('localNotificationActionPerformed',a=>{const ex=a&&a.notification&&a.notification.extra;if(ex&&ex.chat)openChatById(ex.chat)})}
  else if(window.Notification&&Notification.permission==='default'){Notification.requestPermission().catch(()=>{})}
  if(NATIVE&&PNP){
   const r=await PNP.checkPermissions().then(p=>p.receive==='granted'?p:PNP.requestPermissions());
   if(r.receive==='granted'){
    PNP.addListener('registration',t=>{MYTOKEN=t.value;PUSH_ON=true;saveToken()});
    PNP.addListener('registrationError',e=>console.warn('push',e));
    PNP.addListener('pushNotificationActionPerformed',a=>{const d=a&&a.notification&&a.notification.data;if(d&&d.chat)openChatById(d.chat)});
    await PNP.register()}}
 }catch(e){console.warn('bildirim',e)}}
const NT={users:false,posts:false,chats:false,fol:new Set(),pp:{},cl:{}};
function onUsers(){
 const cur=new Set(Object.values(UC).filter(x=>x.uid!==UID&&(x.following||[]).includes(UID)).map(x=>x.uid));
 if(NT.users)cur.forEach(id=>{if(!NT.fol.has(id))notifyEvt(usr(id).username,'seni takip etmeye başladı.',{})});
 NT.fol=cur;NT.users=true}
function onPosts(){
 POSTS.filter(p=>p.uid===UID).forEach(p=>{
  const l=(p.likedBy||[]).filter(x=>x!==UID),c=(p.cmts||[]).filter(x=>x.u!==UID),pv=NT.pp[p.id];
  if(NT.posts&&pv){
   if(l.length>pv.l)notifyEvt(usr(l[l.length-1]).username,'gönderini beğendi.',{});
   if(c.length>pv.c){const lc=c[c.length-1];notifyEvt(usr(lc.u).username,'yorum yaptı: '+lc.t,{})}}
  NT.pp[p.id]={l:l.length,c:c.length}});
 NT.posts=true}
function onChats(s){
 if(!NT.chats){CHATS.forEach(c=>{NT.cl[c.id]=c.lastTs||0});NT.chats=true;openPending();return}
 s.docChanges().forEach(ch=>{
  if(ch.type==='removed')return;
  const c=CHATS.find(x=>x.id===ch.doc.id);if(!c||!c.lastMsg)return;
  const lm=c.lastMsg,ts=c.lastTs||0;if(ts<=(NT.cl[c.id]||0))return;NT.cl[c.id]=ts;
  if(lm.sender===UID||lm.sender==='sys')return;
  if(route.t==='chat'&&route.id===c.id&&!document.hidden)return;
  const u=usr(lm.sender);
  notifyEvt(c.isGroup?(c.name||'Grup'):u.username,(c.isGroup?u.username+': ':'')+lm.t,{chat:c.id},true)});
 openPending()}

 setMode('r');applyTheme();if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!NATIVE){navigator.serviceWorker.register('sw.js').catch(()=>{})}
